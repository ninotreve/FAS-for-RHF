name: Numerical regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_FAS_GS_BACKEND: python
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-deps .
      - name: Numerical identities, independent oracles, and end-to-end reproduction
        run: python -m pytest -q --junitxml=regression-results.xml
      - name: Retain regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-python-${{ matrix.python }}
          path: regression-results.xml
